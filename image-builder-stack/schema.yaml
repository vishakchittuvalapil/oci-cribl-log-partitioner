schemaVersion: 1.1.0
version: "20260805"
title: "Cribl OCI Log Partitioner Image Builder"
description: "Build and publish the OCI Function image into the user's OCI Container Registry using OCI DevOps."
variables:
  tenancy_ocid:
    title: "Tenancy OCID"
    description: "OCI tenancy OCID. Resource Manager normally prepopulates this value."
    visible: false
  compartment_ocid:
    title: "Compartment OCID"
    description: "Compartment where the image-builder stack creates DevOps and OCIR resources."
  region:
    title: "Region"
    description: "OCI region for the deployment, for example us-ashburn-1."
  repository_url:
    title: "GitHub Repository URL"
    description: "GitHub repository containing the Function source and build_spec.yaml."
  repository_branch:
    title: "GitHub Branch"
    description: "GitHub branch to build."
  create_github_connection:
    title: "Create GitHub Connection"
    description: "Create a new OCI DevOps GitHub connection from an OCI Vault secret."
  existing_github_connection_id:
    title: "Existing GitHub Connection OCID"
    description: "Existing OCI DevOps GitHub connection OCID. Required unless Create GitHub Connection is enabled."
  github_access_token_secret_id:
    title: "GitHub Token Secret OCID"
    description: "OCI Vault secret OCID containing a GitHub token."
  ocir_repository_name:
    title: "OCIR Repository Name"
    description: "OCI Container Registry repository for the Function image."
  image_tag:
    title: "Image Tag"
    description: "Function image tag to publish."
  create_ocir_repository:
    title: "Create OCIR Repository"
    description: "Create the OCIR repository. Disable this if the repository already exists or if you are rerunning after a repository conflict."
  ocir_repository_is_public:
    title: "Public OCIR Repository"
    description: "Make the OCIR repository public."
  ocir_repository_is_immutable:
    title: "Immutable OCIR Repository"
    description: "Prevent image overwrites in this OCIR repository."
  object_storage_namespace:
    title: "Object Storage Namespace"
    description: "Leave empty to let Terraform discover the namespace."
  run_build:
    title: "Run Build"
    description: "Start a DevOps build run during apply."
  build_run_version:
    title: "Build Run Version"
    description: "Change this value to force a new build run."
  devops_project_name:
    title: "DevOps Project Name"
    description: "OCI DevOps project display name."
  build_pipeline_name:
    title: "Build Pipeline Name"
    description: "OCI DevOps build pipeline display name."
  build_stage_name:
    title: "Build Stage Name"
    description: "OCI DevOps managed build stage display name."
  deliver_stage_name:
    title: "Deliver Stage Name"
    description: "OCI DevOps deliver artifact stage display name."
  build_source_name:
    title: "Build Source Name"
    description: "OCI DevOps build source folder name."
  build_spec_file:
    title: "Build Spec File"
    description: "Build spec path relative to the source repository root."
  build_stage_image:
    title: "Build Stage Image"
    description: "Managed build runner image."
  build_stage_timeout_in_seconds:
    title: "Build Stage Timeout"
    description: "Managed build timeout in seconds."
  notification_topic_name:
    title: "Notification Topic Name"
    description: "ONS topic used by the DevOps project."
  create_iam_resources:
    title: "Create IAM Resources"
    description: "Create dynamic group and IAM policy required by OCI DevOps."
  dynamic_group_name:
    title: "Dynamic Group Name"
    description: "Dynamic group name for OCI DevOps build pipeline access."
  devops_policy_name:
    title: "DevOps Policy Name"
    description: "IAM policy name for OCI DevOps build permissions."
  freeform_tags:
    title: "Freeform Tags"
    description: "Freeform tags applied to supported resources."
variableGroups:
  - title: "Required"
    variables:
      - ${tenancy_ocid}
      - ${compartment_ocid}
      - ${region}
  - title: "GitHub Source"
    variables:
      - ${repository_url}
      - ${repository_branch}
      - ${create_github_connection}
      - ${existing_github_connection_id}
      - ${github_access_token_secret_id}
  - title: "Image Target"
    variables:
      - ${ocir_repository_name}
      - ${image_tag}
      - ${create_ocir_repository}
      - ${ocir_repository_is_public}
      - ${ocir_repository_is_immutable}
      - ${object_storage_namespace}
  - title: "Build Pipeline"
    variables:
      - ${run_build}
      - ${build_run_version}
      - ${devops_project_name}
      - ${build_pipeline_name}
      - ${build_stage_name}
      - ${deliver_stage_name}
  - title: "Advanced"
    variables:
      - ${build_source_name}
      - ${build_spec_file}
      - ${build_stage_image}
      - ${build_stage_timeout_in_seconds}
      - ${notification_topic_name}
      - ${create_iam_resources}
      - ${dynamic_group_name}
      - ${devops_policy_name}
      - ${freeform_tags}
outputs:
  function_image:
    type: copyableString
    title: "Function Image"
  function_image_digest:
    type: copyableString
    title: "Function Image Digest"
  build_run_id:
    type: copyableString
    title: "Build Run"
