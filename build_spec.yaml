version: 0.1
component: build
timeoutInSeconds: 1800
runAs: root
shell: bash
failImmediatelyOnError: true

steps:
  - type: Command
    name: Build OCI Functions image
    timeoutInSeconds: 1200
    command: |
      cd "${OCI_PRIMARY_SOURCE_DIR}"
      if command -v docker >/dev/null 2>&1; then
        CONTAINER_CLI=docker
      else
        CONTAINER_CLI=podman
      fi
      "${CONTAINER_CLI}" build -t cribl-oci-log-partitioner-function:build .

outputArtifacts:
  - name: cribl-oci-log-partitioner-image
    type: DOCKER_IMAGE
    location: cribl-oci-log-partitioner-function:build
