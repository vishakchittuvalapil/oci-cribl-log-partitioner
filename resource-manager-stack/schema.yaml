schemaVersion: 1.1.0
version: "20260805"
title: "OCI Logs to Cribl Runtime Stack"
description: "Deploy OCI Logging to Object Storage with Cribl-friendly time and log_type partitioning."
variables:
  tenancy_ocid:
    title: "Tenancy OCID"
    description: "OCI tenancy OCID. Resource Manager normally prepopulates this value."
    visible: false
  compartment_ocid:
    title: "Compartment OCID"
    description: "Compartment where the runtime stack creates the bucket, Function, connector, and policies."
  region:
    title: "Region"
    description: "OCI region for the deployment, for example us-ashburn-1."
  function_image:
    title: "Function Image"
    description: "Image URI output from the image-builder stack."
  function_image_digest:
    title: "Function Image Digest"
    description: "Optional image digest output from the image-builder stack."
  log_sources:
    title: "Log Sources"
    description: "OCI Logging source OCIDs and the Cribl log_type folder names to use."
  bucket_name:
    title: "Bucket Name"
    description: "Object Storage bucket name for Cribl-readable objects."
  create_bucket:
    title: "Create Bucket"
    description: "Create the Object Storage bucket. Disable only if the bucket already exists."
  object_prefix:
    title: "Object Prefix"
    description: "Top-level Object Storage prefix Cribl should scan."
  include_minute:
    title: "Include Minute Folder"
    description: "Include minute in the Object Storage path."
  object_storage_namespace:
    title: "Object Storage Namespace"
    description: "Leave empty to let Terraform discover the namespace."
  create_functions_application:
    title: "Create Functions Application"
    description: "Create a new Functions application instead of reusing an existing one."
  existing_functions_application_id:
    title: "Existing Functions Application OCID"
    description: "Required when Create Functions Application is disabled."
  functions_subnet_ids:
    title: "Functions Subnet OCIDs"
    description: "Required when creating a new Functions application."
  functions_application_name:
    title: "Functions Application Name"
    description: "Display name when creating a new Functions application."
  functions_application_shape:
    title: "Functions Application Shape"
    description: "Shape for a new Functions application."
  function_name:
    title: "Function Name"
    description: "OCI Function display name."
  function_memory_in_mbs:
    title: "Function Memory"
    description: "Function memory in MiB."
  function_timeout_in_seconds:
    title: "Function Timeout"
    description: "Function timeout in seconds."
  service_connector_name:
    title: "Service Connector Name"
    description: "Service Connector Hub connector display name."
  service_connector_description:
    title: "Service Connector Description"
    description: "Service Connector Hub connector description."
  connector_batch_size_in_num:
    title: "Connector Batch Size"
    description: "Maximum number of log records per Function invocation."
  connector_batch_time_in_sec:
    title: "Connector Batch Time"
    description: "Maximum batching time in seconds before invocation."
  create_iam_resources:
    title: "Create IAM Resources"
    description: "Create dynamic groups and policies required for the pipeline."
  dynamic_group_name:
    title: "Dynamic Group Name"
    description: "Dynamic group name for Function resource principal access."
  function_bucket_policy_name:
    title: "Function Bucket Policy Name"
    description: "Policy name for Function writes to Object Storage."
  service_connector_policy_name:
    title: "Service Connector Policy Name"
    description: "Policy name for Service Connector Hub permissions."
  freeform_tags:
    title: "Freeform Tags"
    description: "Freeform tags applied to supported resources."
variableGroups:
  - title: "Required"
    variables:
      - ${tenancy_ocid}
      - ${compartment_ocid}
      - ${region}
      - ${function_image}
      - ${log_sources}
  - title: "Object Storage"
    variables:
      - ${bucket_name}
      - ${create_bucket}
      - ${object_prefix}
      - ${include_minute}
      - ${object_storage_namespace}
  - title: "Functions"
    variables:
      - ${create_functions_application}
      - ${existing_functions_application_id}
      - ${functions_subnet_ids}
      - ${functions_application_name}
      - ${functions_application_shape}
      - ${function_name}
      - ${function_image_digest}
      - ${function_memory_in_mbs}
      - ${function_timeout_in_seconds}
  - title: "Service Connector Hub"
    variables:
      - ${service_connector_name}
      - ${service_connector_description}
      - ${connector_batch_size_in_num}
      - ${connector_batch_time_in_sec}
  - title: "IAM and Tags"
    variables:
      - ${create_iam_resources}
      - ${dynamic_group_name}
      - ${function_bucket_policy_name}
      - ${service_connector_policy_name}
      - ${freeform_tags}
outputs:
  cribl_collector_prefix:
    type: copyableString
    title: "Cribl Collector Prefix"
  object_path_pattern:
    type: copyableString
    title: "Object Path Pattern"
  bucket_name:
    type: copyableString
    title: "Bucket Name"
